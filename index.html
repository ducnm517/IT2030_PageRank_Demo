<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageRank Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        textarea { resize: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col md:flex-row">

    <div class="w-full md:w-80 bg-white border-r border-gray-200 p-6 flex flex-col gap-6 shadow-md z-10 overflow-y-auto">
        <div>
            <h1 class="text-xl font-bold text-gray-900 mb-1">PageRank</h1>
            <p class="text-xs text-gray-500">For IT2030.</p>
        </div>

        <div class="flex flex-col gap-2">
            <label for="edges-input" class="text-sm font-semibold text-gray-700">Graph Edges (Source, Target)</label>
            <textarea id="edges-input" class="w-full h-40 p-3 border border-gray-300 rounded-md shadow-sm font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
A,B
A,C
B,C
C,A
D,C</textarea>
        </div>

        <div class="flex flex-col gap-2">
            <div class="flex justify-between">
                <label for="damping-input" class="text-sm font-semibold text-gray-700">User Clickthrough Rate</label>
                <span id="damping-val" class="text-sm font-mono text-blue-600 font-bold">0.99</span>
            </div>
            <input type="range" id="damping-input" min="0.1" max="0.99" step="0.01" value="0.99" class="w-full accent-blue-600">
        </div>

        <div class="flex flex-col gap-3 mt-2">
            <button id="btn-run" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-md shadow-sm transition-colors">
                Run Iteration 1
            </button>
            <button id="btn-reset" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-300 font-semibold py-2.5 px-4 rounded-md shadow-sm transition-colors">
                Reset
            </button>
        </div>
    </div>

    <div id="canvas-container" class="flex-1 relative bg-slate-50">
        <svg id="graph-svg" class="w-full h-full"></svg>
    </div>

    <script>
        const svg = d3.select("#graph-svg");
        const container = document.getElementById('canvas-container');
        let width = container.clientWidth;
        let height = container.clientHeight;
        let simulation, linkElements, nodeElements, textElements;
        let nodesData = [], linksData = [], adjList = {}, currentRanks = {};

        let iter = 1;

        svg.append("defs").append("marker")
            .attr("id", "arrowhead")
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 10)
            .attr("refY", 0)
            .attr("orient", "auto")
            .attr("markerWidth", 10)
            .attr("markerHeight", 10)
            .append("path")
            .attr("d", "M 0,-5 L 10,0 L 0,5")
            .attr("fill", "#94a3b8");

        function runPageRank() {
            const d = parseFloat(document.getElementById('damping-input').value);
            const N = nodesData.length;
            let nextRanks = {};
            
            nodesData.forEach(n => {
                let sum = 0;
                nodesData.forEach(l => {
                    if (adjList[l.id] && adjList[l.id].includes(n.id)) {
                        sum += currentRanks[l.id] / adjList[l.id].length;
                    }
                });
                nextRanks[n.id] = ((1 - d) / N) + (d * sum);
            });
            
            currentRanks = nextRanks;
            updateNodes();
            iter++;
            document.getElementById("btn-run").textContent = "Run Iteration "+iter;
        }

        function parseInput() {
            const text = document.getElementById('edges-input').value;
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            const nodesSet = new Set();
            linksData = [];
            
            lines.forEach(line => {
                const parts = line.split(',');
                if (parts.length >= 2) {
                    const src = parts[0].trim();
                    const tgt = parts[1].trim();
                    if (src && tgt) {
                        nodesSet.add(src);
                        nodesSet.add(tgt);
                        linksData.push({ source: src, target: tgt });
                    }
                }
            });

            nodesData = Array.from(nodesSet).map(id => ({ id }));
            
            adjList = {};
            nodesData.forEach(n => adjList[n.id] = []);
            linksData.forEach(l => adjList[l.source].push(l.target));

            resetRanks();
            renderGraph();
        }

        function resetRanks() {
            const N = nodesData.length;
            iter = 1;
            currentRanks = {};
            if (N > 0) {
                nodesData.forEach(n => currentRanks[n.id] = Math.max(1,Math.round(2**Math.log2(N)/2)) / N);
            }

            document.getElementById("btn-run").textContent = "Run Iteration 1";
        }

        function updateNodes() {
            if (!nodeElements) return;
            nodeElements.transition().duration(400)
                .attr("r", d => Math.max(8, (currentRanks[d.id] || 0) * 120));
            if (textElements) {
                textElements.select(".node-score")
                    .text(d => (currentRanks[d.id] || 0).toFixed(3));
            }
            
            if (linkElements) {
                linkElements.transition().duration(400)
                    .attr("x2", d => {
                        const tr = Math.max(8, (currentRanks[d.target.id] || 0) * 120);
                        const dx = d.target.x - d.source.x;
                        const dy = d.target.y - d.source.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        return dist > 0 ? d.target.x - (dx / dist) * (tr + 8) : d.target.x;
                    })
                    .attr("y2", d => {
                        const tr = Math.max(8, (currentRanks[d.target.id] || 0) * 120);
                        const dx = d.target.x - d.source.x;
                        const dy = d.target.y - d.source.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        return dist > 0 ? d.target.y - (dy / dist) * (tr + 8) : d.target.y;
                    });
            }
        }

        function renderGraph() {
            svg.selectAll(".g-link").remove();
            svg.selectAll(".g-node").remove();

            const linkGroup = svg.append("g").attr("class", "g-link");
            const nodeGroup = svg.append("g").attr("class", "g-node");

            linkElements = linkGroup.selectAll("line")
                .data(linksData)
                .enter().append("line")
                .attr("stroke", "#94a3b8")
                .attr("stroke-width", 2)
                .attr("marker-end", "url(#arrowhead)");

            const nodes = nodeGroup.selectAll("g")
                .data(nodesData)
                .enter().append("g");

            nodeElements = nodes.append("circle")
                .attr("fill", "#3b82f6")
                .attr("stroke", "#ffffff")
                .attr("stroke-width", 3)
                .attr("r", d => Math.max(8, (currentRanks[d.id] || 0) * 120));

            textElements = nodes.append("text")
                .attr("font-family", "monospace")
                .attr("text-anchor", "middle")
                .attr("fill", "#1e293b")
                .attr("dy", "-0.2em");

            textElements.append("tspan")
                .attr("class", "node-id")
                .text(d => d.id)
                .attr("font-size", 16)
                .attr("font-weight", "bold");

            textElements.append("tspan")
                .attr("class", "node-score")
                .text(d => (currentRanks[d.id] || 0).toFixed(3))
                .attr("font-size", 12)
                .attr("dy", "1.2em");

            if (simulation) simulation.stop();
            
            simulation = d3.forceSimulation(nodesData)
                .force("link", d3.forceLink(linksData).id(d => d.id).distance(250))
                .force("charge", d3.forceManyBody().strength(-1500))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .on("tick", () => {
                    linkElements.each(function(d) {
                        const tr = Math.max(8, (currentRanks[d.target.id] || 0) * 120);
                        const dx = d.target.x - d.source.x;
                        const dy = d.target.y - d.source.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        let x2 = d.target.x;
                        let y2 = d.target.y;
                        
                        if (dist > 0) {
                            x2 -= (dx / dist) * (tr + 8);
                            y2 -= (dy / dist) * (tr + 8);
                        }
                        
                        d3.select(this)
                            .attr("x1", d.source.x)
                            .attr("y1", d.source.y)
                            .attr("x2", x2)
                            .attr("y2", y2);
                    });
                    
                    nodeElements.attr("cx", d => d.x).attr("cy", d => d.y);
                    textElements.attr("x", d => d.x).attr("y", d => d.y);
                    textElements.selectAll("tspan").attr("x", d => d.x);
                });
        }

        document.getElementById('btn-run').addEventListener('click', runPageRank);
        document.getElementById('btn-reset').addEventListener('click', () => {
            resetRanks();
            updateNodes();
        });
        document.getElementById('edges-input').addEventListener('input', parseInput);
        document.getElementById('damping-input').addEventListener('input', (e) => {
            document.getElementById('damping-val').innerText = e.target.value;
        });

        window.addEventListener('resize', () => {
            width = container.clientWidth;
            height = container.clientHeight;
            if (simulation) {
                simulation.force("center", d3.forceCenter(width / 2, height / 2)).alpha(0.3).restart();
            }
        });

        parseInput();
    </script>
</body>
</html>
